[package]
name = "story-world-tracker"
version = "0.1.0"
description = "Track where every character is, on a timeline and a globe map"
authors = ["Ojon"]
edition = "2021"

[lib]
name = "story_world_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Spell checking in a Chromebook's (or any Linux) web view is off until it is switched on.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
