name: Desktop installers

# Builds the installers Ojon uses: Windows, and Linux for a Chromebook's Linux environment
# (.deb for Intel/AMD and ARM Chromebooks, plus an AppImage). Runs on pull requests (installers
# attached to the run), from the Actions tab ("Run workflow"), or on a tag like v0.1.0 (draft
# release with installers).
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis,msi
          # Ubuntu 22.04 so the app also runs on the older Debian that ChromeOS's Linux uses.
          - name: chromebook-intel
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: chromebook-arm
            os: ubuntu-22.04-arm
            bundles: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Story World Tracker ${{ github.ref_name }}'
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }}
      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
